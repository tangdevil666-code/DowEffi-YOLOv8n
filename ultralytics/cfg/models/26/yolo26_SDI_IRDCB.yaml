# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 260 layers, 2,572,280 parameters, 2,572,280 gradients, 6.1 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 260 layers, 10,009,784 parameters, 10,009,784 gradients, 22.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 280 layers, 21,896,248 parameters, 21,896,248 gradients, 75.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 392 layers, 26,299,704 parameters, 26,299,704 gradients, 93.8 GFLOPs
  x: [1.00, 1.50, 512] # summary: 392 layers, 58,993,368 parameters, 58,993,368 gradients, 209.5 GFLOPs

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head with IRDCB + SDI
head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 11
  - [[-1, 6], 1, Concat, [1]]                          # 12 cat backbone P4
  - [-1, 1, IRDCB, [512, 2, 2.0, True, 0.5]]           # 13 P4 feature

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 14
  - [[-1, 4], 1, Concat, [1]]                          # 15 cat backbone P3
  - [-1, 1, IRDCB, [256, 2, 2.0, True, 0.5]]           # 16 P3/8-small

  # SDI: inject P2 shallow detail into P3
  # input 0: layer 16, P3 feature
  # input 1: layer 2,  P2 shallow feature
  # output : enhanced P3 feature
  - [[16, 2], 1, SDI, []]                              # 17 enhanced P3/8-small

  # P3 -> P4
  # 这里建议仍然从 16 下采样，保持 SDI 只作用于 P3 检测分支
  - [16, 1, Conv, [256, 3, 2]]                         # 18 downsample P3 -> P4
  - [[-1, 13], 1, Concat, [1]]                         # 19 cat head P4
  - [-1, 1, IRDCB, [512, 2, 2.0, True, 0.5]]           # 20 P4/16-medium

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                         # 21 downsample P4 -> P5
  - [[-1, 10], 1, Concat, [1]]                         # 22 cat head P5
  - [-1, 1, IRDCB, [1024, 2, 2.0, True, 0.5]]          # 23 P5/32-large

  # Detect uses enhanced P3 + IRDCB P4 + IRDCB P5
  - [[17, 20, 23], 1, Detect, [nc]]                    # 24 Detect(P3, P4, P5)