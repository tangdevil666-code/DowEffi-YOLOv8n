# ============================================================================
# yolo26n-p2.yaml  —  YOLO26n + P2 检测头 [BASELINE, 不做任何 EfficientHead 改动]
# ============================================================================
# 这是 "+P2 baseline" 的参考实现, 基于 YOLO11n 标准模板 + 在 head 末端追加
# P2 上采样路径. 30 层 (0-29), Detect 在 line 29, 输入 [19, 22, 25, 28]
# 对应 P2/P3/P4/P5.
#
# 与你已有的 cfg/ablation/yolo26n_p2.yaml 应该结构高度相似 (都是 YOLO26n + P2).
# 如果你的实际文件层索引不同, 按 README 末尾的 "模块替换规则" 应用到你的
# 真实文件即可 — eff_min / eff_mid / eff_full 三个消融的本质是模块替换,
# 不是层索引重写.
#
# 预期 (scale n, imgsz 640, GPU): GFLOPs ≈ 10, params ≈ 2.4M.
# ============================================================================

nc: 1                   # number of classes
scales:                 # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ---------------------------------------------------------------------------
# Backbone (与 YOLO11n 一致, 含 C2PSA)
# ---------------------------------------------------------------------------
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]              # 0  P1/2
  - [-1, 1, Conv,  [128, 3, 2]]             # 1  P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2  ← P2 backbone (head 第 18 行 concat 它)
  - [-1, 1, Conv,  [256, 3, 2]]             # 3  P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]      # 4  ← P3 backbone (head 第 15 行 concat)
  - [-1, 1, Conv,  [512, 3, 2]]             # 5  P4/16
  - [-1, 2, C3k2,  [512, True]]             # 6  ← P4 backbone (head 第 12 行 concat)
  - [-1, 1, Conv,  [1024, 3, 2]]            # 7  P5/32
  - [-1, 2, C3k2,  [1024, True]]            # 8
  - [-1, 1, SPPF,  [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                  # 10  ← P5 backbone (head 第 27 行 concat)

# ---------------------------------------------------------------------------
# Head: PAN with P2 added (4 detection levels: P2/P3/P4/P5)
# ---------------------------------------------------------------------------
head:
  # ---- Top-down: P5 -> P4 ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 11
  - [[-1, 6], 1, Concat, [1]]                        # 12  (cat backbone P4)
  - [-1, 2, C3k2, [512, False]]                      # 13  P4'

  # ---- Top-down: P4 -> P3 ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 14
  - [[-1, 4], 1, Concat, [1]]                        # 15  (cat backbone P3)
  - [-1, 2, C3k2, [256, False]]                      # 16  P3'

  # ---- Top-down: P3 -> P2 (新加的 P2 通路) ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 17
  - [[-1, 2], 1, Concat, [1]]                        # 18  (cat backbone P2)
  - [-1, 2, C3k2, [128, False]]                      # 19  P2 detect feature  ★ 高代价: 160x160

  # ---- Bottom-up: P2 -> P3 ----
  - [-1, 1, Conv, [128, 3, 2]]                       # 20  P2→P3 downsample      ★ 高代价: 160x160 输入
  - [[-1, 16], 1, Concat, [1]]                       # 21  (cat head P3')
  - [-1, 2, C3k2, [256, False]]                      # 22  P3 detect

  # ---- Bottom-up: P3 -> P4 ----
  - [-1, 1, Conv, [256, 3, 2]]                       # 23  P3→P4 downsample
  - [[-1, 13], 1, Concat, [1]]                       # 24  (cat head P4')
  - [-1, 2, C3k2, [512, False]]                      # 25  P4 detect

  # ---- Bottom-up: P4 -> P5 ----
  - [-1, 1, Conv, [512, 3, 2]]                       # 26  P4→P5 downsample
  - [[-1, 10], 1, Concat, [1]]                       # 27  (cat C2PSA P5)
  - [-1, 2, C3k2, [1024, True]]                      # 28  P5 detect

  # ---- Detect: 4 levels P2 / P3 / P4 / P5 ----
  - [[19, 22, 25, 28], 1, Detect, [nc]]              # 29
